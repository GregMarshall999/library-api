services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5433:5432" # 5433 on your machine, so it doesn't clash with the host Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata: